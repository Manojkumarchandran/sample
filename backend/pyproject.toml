[project]
name = "nextask-ai-backend"
version = "0.1.0"
description = "NexTask AI Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "pyjwt[crypto]>=2.9.0",
    "supabase>=2.6.0",
    "google-genai>=0.1.1",
    "tenacity>=9.0.0",
    "mcp>=1.0.0,<2",
    "tavily-python>=0.4.0",
    "pypdf>=4.3.0",
    "langchain-text-splitters>=0.2.0",
    "python-multipart>=0.0.9",
    "langgraph>=0.2.0"
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0"
]
